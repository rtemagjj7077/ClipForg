name: Build and Package ClipForge

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build & Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Repository Structure
        shell: pwsh
        run: |
          if (!(Test-Path "ClipForge.sln")) {
              Write-Host "ClipForge.sln not found at repository root. Searching for nested solution..."
              $sln = Get-ChildItem -Filter "ClipForge.sln" -Recurse | Select-Object -First 1
              if ($sln) {
                  $slnDir = $sln.Directory.FullName
                  Write-Host "Found ClipForge.sln in: $slnDir"
                  Write-Host "Relocating nested solution and project files to repository root..."
                  Get-ChildItem -Path $slnDir -Force | ForEach-Object {
                      if ($_.FullName -ne (Get-Location).Path) {
                          Move-Item -Path $_.FullName -Destination . -Force
                      }
                  }
              } else {
                  Write-Error "Could not find ClipForge.sln anywhere in repository!"
                  exit 1
              }
          }
          if (!(Test-Path "ClipForge.sln")) {
              Write-Error "Failed to position ClipForge.sln at the repository root."
              exit 1
          }
          Write-Host "Confirmed ClipForge.sln located at repository root."
          Get-ChildItem -Path .

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install FFmpeg (Windows)
        run: |
          choco install ffmpeg-full --no-progress
          ffmpeg -version

      - name: Restore NuGet Packages
        run: dotnet restore ClipForge.sln

      - name: Build Avalonia Windows Project
        run: dotnet build ClipForge.Platform.Windows/ClipForge.Platform.Windows.csproj -c Release --no-restore

      - name: Run Automated Tests (Windows)
        run: dotnet test ClipForge.Tests/ClipForge.Tests.csproj -c Release --verbosity normal --logger "trx;LogFileName=test-results-windows.trx"

      - name: Publish Self-Contained Application (win-x64)
        run: >
          dotnet publish ClipForge.Platform.Windows/ClipForge.Platform.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Verify Windows PE Executable & Subsystem
        shell: pwsh
        run: |
          $exePath = "publish/win-x64/ClipForge.exe"
          if (!(Test-Path $exePath)) {
              Write-Error "CRITICAL: ClipForge.exe was not generated by dotnet publish!"
              exit 1
          }

          $fileInfo = Get-Item $exePath
          Write-Host "Found binary: $($fileInfo.FullName)"
          Write-Host "Size: $($fileInfo.Length) bytes"

          if ($fileInfo.Length -lt 5000000) {
              Write-Error "CRITICAL: ClipForge.exe size is $($fileInfo.Length) bytes, which is too small for a self-contained executable."
              exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)

          Write-Host "PE Magic: 0x$($magic.ToString('X'))"
          Write-Host "PE Subsystem: $subsystem"

          if ($magic -ne 0x20B) {
              Write-Error "CRITICAL: Executable architecture is not 64-bit PE32+!"
              exit 1
          }

          if ($subsystem -eq 2) {
              Write-Host "VERIFIED: Executable subsystem is IMAGE_SUBSYSTEM_WINDOWS_GUI (Subsystem = 2). No console window will appear."
          } elseif ($subsystem -eq 3) {
              Write-Error "FAILED: Executable subsystem is Console (Subsystem = 3). Expected Windows GUI."
              exit 1
          } else {
              Write-Host "Executable subsystem: $subsystem"
          }

      - name: Windows Runtime Smoke Test
        shell: pwsh
        run: |
          $exePath = "publish/win-x64/ClipForge.exe"
          Write-Host "Starting ClipForge.exe smoke test..."
          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 4
          
          if ($proc.HasExited) {
              Write-Host "Process exited with code: $($proc.ExitCode)"
              if ($proc.ExitCode -ne 0) {
                  Write-Error "CRITICAL: ClipForge.exe crashed immediately on startup with exit code $($proc.ExitCode)"
                  exit 1
              }
          } else {
              Write-Host "SUCCESS: ClipForge.exe started successfully as a Windows GUI process without immediate exception."
              Stop-Process -Id $proc.Id -Force
          }

      - name: Package Windows Artifact (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath ClipForge-Windows-x64.zip -Force
          Write-Host "Created ClipForge-Windows-x64.zip"

      - name: Upload Windows Publish Directory
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Publish-Directory
          path: publish/win-x64/

      - name: Upload ClipForge-Windows-x64.zip
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-x64
          path: ClipForge-Windows-x64.zip

  build-linux:
    name: Linux Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Repository Structure
        run: |
          if [ ! -f "ClipForge.sln" ]; then
            echo "ClipForge.sln not found at repository root. Searching for nested solution..."
            SLN_FILE=$(find . -name "ClipForge.sln" -not -path "*/.*" | head -n 1)
            if [ -n "$SLN_FILE" ]; then
              SLN_DIR=$(dirname "$SLN_FILE")
              echo "Found ClipForge.sln in: $SLN_DIR"
              echo "Relocating nested solution and project files to repository root..."
              shopt -s dotglob
              mv "$SLN_DIR"/* . 2>/dev/null || cp -rn "$SLN_DIR"/* .
            else
              echo "Could not find ClipForge.sln anywhere in the repository!"
              exit 1
            fi
          fi
          if [ ! -f "ClipForge.sln" ]; then
            echo "Failed to position ClipForge.sln at the repository root."
            exit 1
          fi
          echo "Confirmed ClipForge.sln located at repository root."
          ls -la

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libx11-dev libice6 libsm6 libfontconfig1 libxext6 libxrender1 xvfb

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore ClipForge.sln

      - name: Build Avalonia Linux Project
        run: dotnet build ClipForge.Platform.Linux/ClipForge.Platform.Linux.csproj -c Release --no-restore

      - name: Run Automated Tests (Linux)
        run: dotnet test ClipForge.Tests/ClipForge.Tests.csproj -c Release --verbosity normal --logger "trx;LogFileName=test-results-linux.trx"

      - name: Publish Self-Contained Application (linux-x64)
        run: >
          dotnet publish ClipForge.Platform.Linux/ClipForge.Platform.Linux.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64

      - name: Verify Linux Executable
        run: |
          BINARY="publish/linux-x64/ClipForge"
          if [ ! -f "$BINARY" ]; then
            echo "CRITICAL: ClipForge binary was not generated by dotnet publish!"
            exit 1
          fi
          chmod +x "$BINARY"
          file "$BINARY"
          ls -lh "$BINARY"
          
          SIZE=$(stat -c%s "$BINARY")
          if [ "$SIZE" -lt 5000000 ]; then
            echo "CRITICAL: Binary size ($SIZE bytes) is too small for a self-contained executable."
            exit 1
          fi

      - name: Linux Smoke Test (Headless Xvfb)
        run: |
          BINARY="publish/linux-x64/ClipForge"
          echo "Launching ClipForge with xvfb-run for runtime smoke test..."
          xvfb-run -a timeout 4s "$BINARY" || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "SUCCESS: ClipForge ran successfully and was terminated by timeout (no immediate crash)."
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "SUCCESS: ClipForge completed with exit code 0."
          else
            echo "Process exited with code $EXIT_CODE"
          fi

      - name: Package Linux Distribution (tar.gz)
        run: |
          mkdir -p staging-linux
          cp -r publish/linux-x64/* staging-linux/
          cp ClipForge.Platform.Linux/ClipForge.desktop staging-linux/
          cp ClipForge.UI/Assets/ClipForge.png staging-linux/
          tar -czvf ClipForge-Linux-x64.tar.gz -C staging-linux .
          ls -lh ClipForge-Linux-x64.tar.gz

      - name: Upload Linux Publish Directory
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Linux-Publish-Directory
          path: publish/linux-x64/

      - name: Upload ClipForge-Linux-x64.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Linux-x64
          path: ClipForge-Linux-x64.tar.gz
